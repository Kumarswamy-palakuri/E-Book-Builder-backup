<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="100%" className="diagram-svg">
  <defs>
    <style>
      .geom-line { stroke: #0f172a; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .geom-point { fill: #2563eb; }
      .geom-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .geom-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-style: italic; fill: #475569; }
      .geom-fill { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.2; }
    </style>
  </defs>

  <rect width="280" height="200" fill="#ffffff" rx="8"/>

  <!-- Right Triangle:
       A: (60, 35)
       B: (60, 160) - Right angle
       C: (220, 160)
  -->
  <polygon points="60,35 60,160 220,160" class="geom-fill" fill-opacity="0.2" />

  <!-- Right angle square marker at B -->
  <polyline points="60,144 76,144 76,160" stroke="#0f172a" stroke-width="1.8" fill="none" />

  <!-- Points -->
  <circle cx="60" cy="35" r="3" class="geom-point" />
  <circle cx="60" cy="160" r="3" class="geom-point" />
  <circle cx="220" cy="160" r="3" class="geom-point" />

  <!-- Labels -->
  <text x="50" y="30" class="geom-text">A</text>
  <text x="45" y="175" class="geom-text">B</text>
  <text x="228" y="175" class="geom-text">C</text>

  <!-- Side dimensions -->
  <text x="36" y="105" class="geom-sub" text-anchor="middle">c</text>
  <text x="140" y="180" class="geom-sub" text-anchor="middle">a (Base)</text>
  <text x="155" y="90" class="geom-sub" text-anchor="middle">b (Hypotenuse)</text>

  <text x="140" y="196" font-family="system-ui, sans-serif" font-size="11px" fill="#64748b" text-anchor="middle">
    b² = a² + c²
  </text>
</svg>
