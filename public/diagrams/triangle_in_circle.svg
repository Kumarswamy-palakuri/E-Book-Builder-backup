<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%" className="diagram-svg">
  <defs>
    <style>
      .geom-line { stroke: #1e293b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .geom-dash { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .geom-circle { stroke: #2563eb; stroke-width: 2.2; fill: #eff6ff; fill-opacity: 0.25; }
      .geom-point { fill: #1d4ed8; }
      .geom-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .geom-arc { stroke: #e11d48; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Background container -->
  <rect width="300" height="240" fill="#ffffff" rx="8"/>

  <!-- Main Circle with center O at (150, 125) radius 85 -->
  <circle cx="150" cy="125" r="85" class="geom-circle" />

  <!-- Center O -->
  <circle cx="150" cy="125" r="3" class="geom-point" />
  <text x="156" y="123" class="geom-text">O</text>

  <!-- Inscribed Triangle ABC:
       A at top (150, 40)
       B at bottom-left (85, 175)
       C at bottom-right (215, 175)
  -->
  <polygon points="150,40 85,175 215,175" class="geom-line" stroke="#1d4ed8" fill="#3b82f6" fill-opacity="0.08" stroke-width="2.2" />

  <!-- Radii to B and C (dashed) -->
  <line x1="150" y1="125" x2="85" y2="175" class="geom-dash" />
  <line x1="150" y1="125" x2="215" y2="175" class="geom-dash" />

  <!-- Angle arc at A -->
  <path d="M 143 56 A 16 16 0 0 0 157 56" class="geom-arc" />

  <!-- Angle arc at O (central angle BOC) -->
  <path d="M 136 136 A 20 20 0 0 0 164 136" class="geom-arc" stroke="#059669" />

  <!-- Vertices labels -->
  <text x="145" y="30" class="geom-text" text-anchor="middle">A</text>
  <text x="70" y="185" class="geom-text">B</text>
  <text x="225" y="185" class="geom-text">C</text>

  <!-- Dimension / Subtitle note -->
  <text x="150" y="222" font-family="system-ui, sans-serif" font-size="11px" fill="#64748b" text-anchor="middle">
    ∠BAC = ½ ∠BOC
  </text>
</svg>
