<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" className="diagram-svg">
  <defs>
    <style>
      .geom-line { stroke: #0f172a; stroke-width: 2; fill: none; stroke-linecap: round; }
      .geom-circle { stroke: #8b5cf6; stroke-width: 2.2; fill: #faf5ff; }
      .geom-point { fill: #6d28d9; }
      .geom-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; }
      .geom-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect width="320" height="220" fill="#ffffff" rx="8"/>

  <!-- Circle centered at (190, 110) radius 65 -->
  <circle cx="190" cy="110" r="65" class="geom-circle" />

  <!-- Center O -->
  <circle cx="190" cy="110" r="3" class="geom-point" />
  <text x="195" y="108" class="geom-text">O</text>

  <!-- External point P at (35, 110) -->
  <circle cx="35" cy="110" r="3" class="geom-point" />
  <text x="20" y="115" class="geom-text">P</text>

  <!-- Tangent line PT: T is at (155, 52) where circle tangent touches -->
  <line x1="35" y1="110" x2="210" y2="25" class="geom-line" stroke="#2563eb" stroke-width="2.2" />
  <circle cx="155" cy="52" r="3" class="geom-point" />
  <text x="150" y="42" class="geom-text">T</text>

  <!-- Secant line PAB: A is at (125, 110), B is at (255, 110) -->
  <line x1="35" y1="110" x2="275" y2="110" class="geom-line" stroke="#0f172a" stroke-width="2" />
  <circle cx="125" cy="110" r="3" class="geom-point" />
  <circle cx="255" cy="110" r="3" class="geom-point" />
  <text x="122" y="128" class="geom-text">A</text>
  <text x="252" y="128" class="geom-text">B</text>

  <!-- Radius OT to point of tangency (dashed) -->
  <line x1="190" y1="110" x2="155" y2="52" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Tangency right-angle mark -->
  <polyline points="159,59 166,56 162,49" stroke="#9333ea" stroke-width="1.5" fill="none" />

  <!-- Theorem formula -->
  <text x="160" y="195" font-family="system-ui, sans-serif" font-size="12px" font-weight="bold" fill="#334155" text-anchor="middle">
    PT² = PA × PB
  </text>
</svg>
